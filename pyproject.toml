[project]
name = "bible-japanese-anki"
version = "0.1.0"
description = "Anki deck for the Japanese Bible vocabulary taught by Japanese Bible Study Club"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jp-core[audio]",
]

[project.optional-dependencies]
audio = ["jp-core[audio]"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.sources]
# Pinned to a revision rather than tracking main: a library change can alter
# how cards render, and that should be a deliberate bump with a rebuild and a
# deck comparison, never something a fresh `uv sync` picks up silently.
"jp-core" = { git = "https://github.com/KakkoiDev/jp-core", rev = "211c0b079bbc18925b3ba2976f78c74b15cf1cc7" }

[tool.pytest.ini_options]
testpaths = ["tests"]
